<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>HYPERLIQUID XNT</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Courier New',monospace;background:#000;color:#00ff41;padding:20px;line-height:1.6;overflow-x:hidden;position:relative}.matrix-bg{position:fixed;top:0;left:0;width:100%;height:100%;opacity:0.03;z-index:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,#00ff41 2px,#00ff41 4px)}.container{max-width:1400px;margin:0 auto;position:relative;z-index:1}.header{text-align:center;padding:20px;border:1px solid #00ff41;margin-bottom:20px;background:rgba(0,20,0,0.95);box-shadow:0 0 20px rgba(0,255,65,0.3),inset 0 0 20px rgba(0,255,65,0.1);position:relative}.header h1{font-size:1.8em;margin-bottom:10px;text-shadow:0 0 10px #00ff41,0 0 20px #00ff41;letter-spacing:4px;font-weight:300}.header p{font-size:0.85em;color:#0f0;opacity:0.8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}.panel{border:1px solid #00ff41;padding:20px;background:rgba(0,20,0,0.95);box-shadow:0 0 15px rgba(0,255,65,0.2),inset 0 0 15px rgba(0,255,65,0.05);position:relative;transition:all 0.3s}.panel:hover{box-shadow:0 0 25px rgba(0,255,65,0.4),inset 0 0 20px rgba(0,255,65,0.1)}.panel h2{margin-bottom:15px;border-bottom:1px solid #00ff41;padding-bottom:10px;font-size:1.1em;font-weight:400;text-shadow:0 0 5px #00ff41}.wallet-info{background:rgba(0,40,0,0.5);padding:12px;margin:10px 0;border:1px solid #00ff41;border-left:3px solid #00ff41}.wallet-info .label{color:#0f0;font-size:0.75em;opacity:0.8;text-transform:uppercase;letter-spacing:1px}.wallet-info .value{font-size:0.85em;word-break:break-all;margin-top:5px;font-family:monospace}.balance{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:10px 0}.balance-item{background:rgba(0,40,0,0.5);padding:15px;text-align:center;border:1px solid #00ff41;border-left:3px solid #00ff41;transition:all 0.3s}.balance-item:hover{border-left-width:5px;box-shadow:0 0 15px rgba(0,255,65,0.3)}.balance-item .label{color:#0f0;font-size:0.75em;opacity:0.8;text-transform:uppercase;letter-spacing:1px}.balance-item .amount{font-size:1.4em;font-weight:bold;margin-top:8px;text-shadow:0 0 5px #00ff41}.form-group{margin:12px 0}.form-group label{display:block;margin-bottom:8px;font-size:0.85em;text-transform:uppercase;letter-spacing:1px}.form-group input{width:100%;padding:12px;background:rgba(0,40,0,0.5);border:1px solid #00ff41;color:#00ff41;font-family:'Courier New',monospace;font-size:1em;transition:all 0.3s}.form-group input:focus{outline:none;border-color:#0f0;box-shadow:0 0 10px rgba(0,255,65,0.3)}.btn{width:100%;padding:14px;background:rgba(0,40,0,0.8);border:1px solid #00ff41;color:#00ff41;font-family:'Courier New',monospace;font-size:0.9em;cursor:pointer;margin-top:10px;transition:all 0.3s;text-transform:uppercase;letter-spacing:2px;font-weight:600}.btn:hover{background:#00ff41;color:#000;box-shadow:0 0 20px rgba(0,255,65,0.6);transform:translateY(-2px)}.btn:disabled{opacity:0.3;cursor:not-allowed}.btn-success{border-color:#0f0;color:#0f0}.btn-success:hover{background:#0f0;color:#000}.btn-danger{border-color:#ff3366;color:#ff3366}.btn-danger:hover{background:#ff3366;color:#000}.btn-warning{border-color:#ffaa00;color:#ffaa00}.btn-warning:hover{background:#ffaa00;color:#000}.alert{padding:12px;margin:10px 0;border:1px solid;font-size:0.85em}.alert-success{border-color:#0f0;color:#0f0;background:rgba(0,255,65,0.1)}.alert-error{border-color:#ff3366;color:#ff3366;background:rgba(255,51,102,0.1)}.hidden{display:none}.loading{animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}.hl-accent{color:#00d9ff;text-shadow:0 0 5px #00d9ff}</style>
</head><body>
<div class="matrix-bg"></div>
<div class="container">
<div class="header"><h1><span class="hl-accent">HYPER</span>LIQUID <span style="opacity:0.6">×</span> XNT</h1><p>PERPETUAL TRADING PROTOCOL</p></div>
<div class="grid">
<div class="panel"><h2>WALLET</h2>
<div class="wallet-info"><div class="label">ADDRESS:</div><div class="value" id="walletAddress">NO WALLET</div></div>
<button class="btn btn-success" id="createWalletBtn" onclick="createWallet()">CREATE WALLET</button>
<button class="btn btn-warning" id="airdropBtn" onclick="requestAirdrop()" style="display:none">AIRDROP 100K USDC</button></div>
<div class="panel"><h2>BALANCES</h2>
<div class="balance">
<div class="balance-item"><div class="label">USDC</div><div class="amount" id="usdcBalance">0</div></div>
<div class="balance-item"><div class="label">XNT</div><div class="amount" id="xntBalance">0</div></div></div></div></div>
<div class="grid">
<div class="panel"><h2>BUY XNT</h2><p style="font-size:0.6em;margin-bottom:10px">SPEND USDC TO BUY XNT</p>
<div class="form-group"><label>AMOUNT (USDC):</label><input type="number" id="buyAmount" placeholder="1000"></div>
<button class="btn btn-success" id="buyBtn" onclick="executeBuy()">BUY XNT</button></div>
<div class="panel"><h2>SELL XNT</h2><p style="font-size:0.6em;margin-bottom:10px">SELL XNT FOR USDC</p>
<div class="form-group"><label>AMOUNT (XNT):</label><input type="number" id="sellAmount" placeholder="1000"></div>
<button class="btn btn-danger" id="sellBtn" onclick="executeSell()">SELL XNT</button></div></div>
<div class="panel"><h2>POOL INFO</h2>
<div class="balance">
<div class="balance-item"><div class="label">XNT RESERVE</div><div class="amount" id="poolXnt">-</div></div>
<div class="balance-item"><div class="label">USDC RESERVE</div><div class="amount" id="poolUsdc">-</div></div>
<div class="balance-item"><div class="label">PRICE</div><div class="amount" id="poolPrice">$-</div></div>
<div class="balance-item"><div class="label">CEILING RESERVE</div><div class="amount" id="ceilingReserve">-</div></div></div></div>
<div class="panel" id="txStatusPanel" style="display:none"><h2>TX STATUS</h2><div id="txStatus"></div></div>
</div>
<script src="/trading-app.js"></script>
</body></html>
