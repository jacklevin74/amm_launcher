<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>HYPERLIQUID ADMIN</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Courier New',monospace;background:#000;color:#00ff41;padding:20px;line-height:1.6;overflow-x:hidden;position:relative}.matrix-bg{position:fixed;top:0;left:0;width:100%;height:100%;opacity:0.03;z-index:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,#00ff41 2px,#00ff41 4px)}.container{max-width:1100px;margin:0 auto;position:relative;z-index:1}.header{text-align:center;padding:20px;border:1px solid #00ff41;margin-bottom:20px;background:rgba(0,20,0,0.95);box-shadow:0 0 20px rgba(0,255,65,0.3),inset 0 0 20px rgba(0,255,65,0.1);position:relative}.header h1{font-size:1.8em;margin-bottom:10px;text-shadow:0 0 10px #00ff41,0 0 20px #00ff41;letter-spacing:4px;font-weight:300}.header p{font-size:0.85em;color:#0f0;opacity:0.8;text-transform:uppercase;letter-spacing:2px}.panel{border:1px solid #00ff41;padding:20px;background:rgba(0,20,0,0.95);box-shadow:0 0 15px rgba(0,255,65,0.2),inset 0 0 15px rgba(0,255,65,0.05);margin-bottom:20px;transition:all 0.3s}.panel:hover{box-shadow:0 0 25px rgba(0,255,65,0.4),inset 0 0 20px rgba(0,255,65,0.1)}.panel h2{margin-bottom:15px;border-bottom:1px solid #00ff41;padding-bottom:10px;font-size:1.1em;font-weight:400;text-shadow:0 0 5px #00ff41;text-transform:uppercase;letter-spacing:2px}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:15px 0}.stat{background:rgba(0,40,0,0.5);padding:18px;text-align:center;border:1px solid #00ff41;border-left:3px solid #00ff41;transition:all 0.3s}.stat:hover{border-left-width:5px;box-shadow:0 0 15px rgba(0,255,65,0.3)}.stat .label{font-size:0.75em;margin-bottom:8px;color:#0f0;opacity:0.8;text-transform:uppercase;letter-spacing:1px}.stat .value{font-size:1.5em;font-weight:bold;text-shadow:0 0 5px #00ff41}.form-group{margin:12px 0}.form-group label{display:block;margin-bottom:8px;font-size:0.85em;text-transform:uppercase;letter-spacing:1px}.form-group input{width:100%;padding:12px;background:rgba(0,40,0,0.5);border:1px solid #00ff41;color:#00ff41;font-family:'Courier New',monospace;font-size:1em;transition:all 0.3s}.form-group input:focus{outline:none;border-color:#0f0;box-shadow:0 0 10px rgba(0,255,65,0.3)}.btn{width:100%;padding:14px;background:rgba(0,40,0,0.8);border:1px solid #00ff41;color:#00ff41;font-family:'Courier New',monospace;font-size:0.9em;cursor:pointer;margin-top:10px;transition:all 0.3s;text-transform:uppercase;letter-spacing:2px;font-weight:600}.btn:hover{background:#00ff41;color:#000;box-shadow:0 0 20px rgba(0,255,65,0.6);transform:translateY(-2px)}.btn:disabled{opacity:0.3;cursor:not-allowed}.btn-danger{border-color:#ff3366;color:#ff3366}.btn-danger:hover{background:#ff3366;color:#000}.alert{padding:12px;margin:10px 0;border:1px solid;font-size:0.85em}.alert-success{border-color:#0f0;color:#0f0;background:rgba(0,255,65,0.1)}.alert-error{border-color:#ff3366;color:#ff3366;background:rgba(255,51,102,0.1)}.wallet-info{margin:10px 0;font-size:0.85em;background:rgba(0,40,0,0.5);padding:12px;border:1px solid #00ff41;border-left:3px solid #00ff41}.wallet-info .label{color:#0f0;margin-bottom:5px;text-transform:uppercase;letter-spacing:1px;opacity:0.8}.wallet-info .value{word-break:break-all;font-family:monospace}.hidden{display:none}.loading{animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}.hl-accent{color:#00d9ff;text-shadow:0 0 5px #00d9ff}.warning-text{color:#ffaa00;text-shadow:0 0 5px #ffaa00}</style>
</head><body>
<div class="matrix-bg"></div>
<div class="container">
<div class="header"><h1><span class="hl-accent">HYPER</span>LIQUID <span style="opacity:0.6">×</span> ADMIN</h1><p>Reserve Management Protocol</p></div>
<div class="panel"><h2>Authorization</h2><div style="background:rgba(0,40,0,0.3);padding:15px;border:1px solid rgba(0,255,65,0.3)">
<div class="wallet-info"><div class="label">ADMIN WALLET:</div><div class="value" id="adminWallet">LOADING...</div></div>
<div class="wallet-info"><div class="label">POOL AUTHORITY:</div><div class="value" id="poolAuthority">LOADING...</div></div>
<div id="authStatus" style="margin-top:8px"></div></div></div>
<div class="panel" id="reservePanel" style="display:none"><h2>STATS</h2>
<div class="stat-grid"><div class="stat"><div class="label">RESERVE</div><div class="value" id="reserveBalance">-</div></div>
<div class="stat"><div class="label">POOL XNT</div><div class="value" id="poolXntReserve">-</div></div>
<div class="stat"><div class="label">PRICE</div><div class="value" id="currentPrice">$-</div></div></div></div>
<div id="actionsPanel" style="display:none">
<div class="panel"><h2>Deposit XNT</h2><p style="font-size:0.85em;margin-bottom:12px;opacity:0.8">Add XNT to reserve for ceiling defense mechanism</p>
<div class="form-group"><label>Amount (XNT):</label><input type="number" id="depositAmount" placeholder="1000000"></div>
<button class="btn" id="depositBtn" onclick="depositToReserve()">Execute Deposit</button></div>
<div class="panel"><h2><span class="warning-text">Withdraw XNT</span></h2><p style="font-size:0.85em;margin-bottom:12px;opacity:0.8">Remove XNT from ceiling reserve</p>
<div class="form-group"><label>Amount (XNT):</label><input type="number" id="withdrawAmount" placeholder="1000000"></div>
<button class="btn btn-danger" id="withdrawBtn" onclick="withdrawFromReserve()">Execute Withdrawal</button></div></div>
<div class="panel" id="txStatusPanel" style="display:none"><h2>TX STATUS</h2><div id="txStatus"></div></div>
</div>
<script src="/admin-app.js"></script>
</body></html>
